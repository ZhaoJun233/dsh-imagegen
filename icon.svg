<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="dsh-imagegen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="0.55" stop-color="#6D5CEA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#E4E7FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- badge background -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>

  <!-- photo frame -->
  <rect x="146" y="146" width="220" height="220" rx="42" fill="#FFFFFF"/>
  <rect x="158" y="158" width="196" height="196" rx="32" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="298" cy="208" r="22" fill="#FDE047"/>
  <circle cx="298" cy="208" r="30" fill="#FDE047" opacity="0.35" filter="url(#glow)"/>

  <!-- mountains -->
  <polygon points="158,354 236,238 314,354" fill="#8B9CF6"/>
  <polygon points="222,354 300,270 378,354" fill="#5B5BD6"/>

  <!-- main AI sparkle (4-point star) -->
  <path d="M 366 116 Q 366 148 398 148 Q 366 148 366 180 Q 366 148 334 148 Q 366 148 366 116 Z" fill="#FFFFFF"/>
  <path d="M 366 116 Q 366 148 398 148 Q 366 148 366 180 Q 366 148 334 148 Q 366 148 366 116 Z" fill="#FFFFFF" opacity="0.4" filter="url(#glow)"/>

  <!-- small sparkle -->
  <path d="M 236 330 Q 236 348 254 348 Q 236 348 236 366 Q 236 348 218 348 Q 236 348 236 330 Z" fill="#FFFFFF" opacity="0.92"/>

  <!-- accent dots -->
  <circle cx="392" cy="330" r="5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="136" cy="180" r="6" fill="#FFFFFF" opacity="0.85"/>
</svg>
